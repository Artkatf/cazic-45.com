<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASINO X</title>
    <style>
        :root {
            --bg-color: #0b111e;
            --card-bg: #111a2e;
            --accent-green: #00ffcc;
            --text-color: #ffffff;
            --text-muted: #8fa0be;
            --danger-color: #ff4a4a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Шапка сайта */
        header {
            background-color: var(--card-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1a2642;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-icon {
            width: 40px;
            height: 40px;
            background-color: #7f8c8d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .user-icon svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        .brand-name {
            font-size: 24px;
            font-weight: bold;
            color: #2980b9;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .balance-container {
            background-color: #0d1726;
            border: 1px solid #1f3154;
            padding: 8px 16px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .balance-label {
            color: var(--text-muted);
            font-size: 14px;
        }

        .balance-value {
            color: var(--accent-green);
            font-size: 18px;
        }

        .plus-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .plus-btn:hover {
            background-color: #2ecc71;
        }

        /* Главный контейнер экранов */
        .screen {
            display: none;
            padding: 40px 20px;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        .screen.active {
            display: flex;
        }

        /* ЭКРАН 1: Главная страница */
        .slots-grid {display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 900px;
            margin-top: 20px;
        }

        .slot-card {
            background-color: var(--card-bg);
            border: 1px solid #1a2642;
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            overflow: hidden;
        }

        .slot-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-green);
        }

        .slot-card.disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .slot-card.disabled:hover {
            transform: none;
            border-color: #1a2642;
        }

        .slot-title {
            color: var(--accent-green);
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .slot-desc {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ЭКРАН 2: Страница промокодов */
        .promo-panel {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #1a2642;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .promo-panel h2 {
            margin-bottom: 25px;
            color: var(--accent-green);
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background-color: #0d1726;
            border: 1px solid #1f3154;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent-green);
        }

        .btn {
            background-color: var(--accent-green);
            color: #0b111e;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .back-btn {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid #1f3154;
            margin-top: 15px;
        }

        .back-btn:hover {
            background-color: #1a2642;
            color: white;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            min-height: 20px;
        }

        .msg-error { color: var(--danger-color); }
        .msg-success { color: #2ecc71; }

        /* ЭКРАН 3: Игровая зона Слот-машины */
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 700px;
        }

        /* Стилизация самого игрового автомата на основе фото */
        .slot-machine-container {
            background: linear-gradient(135deg, #bdc3c7, #2c3e50);
            border: 12px solid #c0392b;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            margin-bottom: 30px;
        }

        .machine-header {
            background-color: #111;
            border: 4px solid #f1c40f;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 0 15px #f1c40f;
        }.machine-header h1 {
            color: #f1c40f;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #f1c40f;
            animation: blink 1s infinite alternate;
        }

        @keyframes blink {
            0% { opacity: 0.8; }
            100% { opacity: 1; text-shadow: 0 0 20px #f39c12, 0 0 30px #ff0000; }
        }

        /* Барабаны */
        .reels-wrapper {
            background-color: #f39c12;
            border: 6px solid #d35400;
            border-radius: 10px;
            display: flex;
            justify-content: space-around;
            padding: 15px 10px;
            gap: 10px;
        }

        .reel-window {
            background-color: white;
            width: 30%;
            height: 120px;
            border: 4px solid #34495e;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .reel-strip {
            position: absolute;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            transition: top 0s ease-in-out;
        }

        .symbol-item {
            height: 120px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            font-weight: bold;
        }

        /* Панель управления под автоматом */
        .controls-panel {
            background-color: var(--card-bg);
            border: 1px solid #1a2642;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
        }

        .bet-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .bet-group label {
            color: var(--text-muted);
            font-size: 14px;
        }

        .bet-controls-inner {
            display: flex;
            gap: 10px;
        }

        .bet-input {
            margin-bottom: 0;
            text-align: left;
            padding-left: 15px;
        }

        .confirm-btn {
            width: auto;
            white-space: nowrap;
            background-color: #2980b9;
            color: white;
        }

.payout-table {

// Глобальное состояние игры
let state = {
balance: 5000,
currentBet: 100,
isBetConfirmed: true,
isSpinning: false
};
// Пул символов с учетом редкости (чем выше награда, тем реже символ дублируется в массиве)
const symbolsConfig = [
{ char: '🍌', weight: 15, win: 0, name: 'банан' },
{ char: '🍑', weight: 12, win: 100, name: 'персик' },
{ char: '🍏', weight: 9, win: 500, name: 'слива' },
{ char: '🍋', weight: 7, win: 1000, name: 'лимон' },
{ char: '🍓', weight: 5, win: 1500, name: 'клубника' },
{ char: '🍇', weight: 4, win: 2000, name: 'малина' },
{ char: '9', weight: 2, win: 5000, name: 'девять' },
{ char: '7', weight: 1, win: 3000, name: 'семь' }
];
// Генерируем плоский массив на основе весов для рандома
let pool = [];
symbolsConfig.forEach(s => {
for(let i=0; i<s.weight; i++) pool.push(s.char);
});
// Инициализация при загрузке страницы
window.onload = function() {
updateBalanceDisplay();
initReels();
};
function updateBalanceDisplay() {
document.getElementById('balance-display').innerText = state.balance;
}
// Переключение между экранами (SPA)
function showScreen(screenId) {
if (state.isSpinning) return; // Запрет перехода во время крутки
document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
document.getElementById(screenId).classList.add('active');
// Сброс сообщений при смене экрана
document.getElementById('promo-message').className = "message";
document.getElementById('promo-message').innerText = "";
document.getElementById('game-message').innerText = "";
document.getElementById('promo-input').value = "";
}
// Промокоды
function activatePromo() {
const input = document.getElementById('promo-input').value.trim();
const msg = document.getElementById('promo-message');
if (input === 'Pasha' || input === 'Dima') {
state.balance += 3000000;
updateBalanceDisplay();
msg.className = "message msg-success";
msg.innerText = "Успешно! Начислено 3 000 000 валюты.";
} else {
msg.className = "message msg-error";
msg.innerText = "Неверный промокод.";
}
}
// Валидация и подтверждение ставки
function confirmBet() {
const betInput = document.getElementById('bet-input');
const gameMsg = document.getElementById('game-message');
const val = parseInt(betInput.value);
if (isNaN(val) || val <= 0 || val > state.balance || state.balance === 0) {
gameMsg.className = "message msg-error";
gameMsg.innerText = "Сумма не допустима";
state.isBetConfirmed = false;
return false;
}
state.currentBet = val;
gameMsg.className = "message msg-success";
gameMsg.innerText = Ставка ${val} принята;
state.isBetConfirmed = true;
return true;
}
// Генерация начальных символов в барабанах
function initReels() {
for (let i = 1; i <= 3; i++) {
const strip = document.getElementById(reel${i});
strip.innerHTML = '';
const randomSym = pool[Math.floor(Math.random() * pool.length)];
const item = document.createElement('div');
item.className = 'symbol-item';
item.innerText = randomSym;
strip.appendChild(item);
}
}
// Логика вращения
function startSpin() {
if (state.isSpinning) return;
const gameMsg = document.getElementById('game-message');
// Принудительно проверяем ставку перед началом спина
if (!confirmBet()) return;
// Снимаем ставку с баланса
state.balance -= state.currentBet;
updateBalanceDisplay();
state.isSpinning = true;
document.getElementById('spin-button').disabled = true;
document.getElementById('machine-status').innerText = "SPINNING...";
gameMsg.innerText = "";
// Выбираем итоговые выпадающие символы
const res1 = pool[Math.floor(Math.random() * pool.length)];
const res2 = pool[Math.floor(Math.random() * pool.length)];
const res3 = pool[Math.floor(Math.random() * pool.length)];
// Запуск анимации визуальной прокрутки
animateReel('reel1', res1, 0);
animateReel('reel2', res2, 150);
animateReel('reel3', res3, 300, () => {
// Вызывается по окончании анимации последнего барабана
evaluateResult(res1, res2, res3);
});
}
// Анимация барабанаfunction animateReel(reelId, finalSymbol, delay, callback) {
setTimeout(() => {
const strip = document.getElementById(reelId);
let ticks = 0;
let maxTicks = 12; // Длина крутки
let interval = setInterval(() => {
strip.innerHTML = '';
const randomSym = pool[Math.floor(Math.random() * pool.length)];
const item = document.createElement('div');
item.className = 'symbol-item';
item.innerText = randomSym;
strip.appendChild(item);
ticks++;
if (ticks >= maxTicks) {
clearInterval(interval);
// Установка финального значения
strip.innerHTML = <div class="symbol-item">${finalSymbol}</div>;
if (callback) callback();
}
}, 80);
}, delay);
}
// Расчет выигрыша
function evaluateResult(s1, s2, s3) {
state.isSpinning = false;
document.getElementById('spin-button').disabled = false;
const statusHeader = document.getElementById('machine-status');
const gameMsg = document.getElementById('game-message');
// Проверка на выпадение комбинации (3 одинаковых в ряд)
if (s1 === s2 && s2 === s3) {
const winSymbol = s1;
if (winSymbol === '7') {
// Особый случай для трех семерок
statusHeader.innerText = "JACKPOT";
state.balance += 1000000;
gameMsg.className = "message msg-success";
gameMsg.innerText = "JACKPOT! Вы выиграли 1 000 000 валюты!";
} else {
// Остальные символы
const config = symbolsConfig.find(c => c.char === winSymbol);
if (config && config.win > 0) {
statusHeader.innerText = "WIN!";
state.balance += config.win;
gameMsg.className = "message msg-success";
gameMsg.innerText = Три в ряд! Выигрыш: +${config.win} за символ [${winSymbol}];
} else {
// Для Банана выигрыш 0
statusHeader.innerText = "BIG WIN";
gameMsg.className = "message";
gameMsg.innerText = "Три в ряд! Но этот символ ничего не приносит.";
}
}
} else {
// Нет совпадений
statusHeader.innerText = "BIG WIN";
gameMsg.className = "message msg-error";
gameMsg.innerText = "Нет совпадений. Попробуйте еще раз!";
}
updateBalanceDisplay();
}
        </script>
